# SDK per-module CI gates (epic #27), driven by the org reusable (#39).
#
# Lane bodies live in the pinned reusable
# eshu-hq/.github/.github/workflows/go-multi-module-ci.yml. This file only
# passes the SDK's module matrix, coverage floors, and repo hooks, then keeps
# a local ci-complete aggregator so the required context on main is unchanged
# (ruleset 26010900 still requires exactly ci-complete).
#
# Reusable pin: eshu-hq/.github @ 79dd01d7719645485e2e8e07e8075ccba8c518b5
# (merged via upstream PR #6, which follows PR #2; no tag exists yet, tags
# are maintainer-controlled — verify before advancing).
# Satellite pin for consumer-compat (verify before advancing):
# eshu-hq/eshu-collector-kubernetes-live @ 2ec5ade94f2ccee4401e6c7767b1b5bc4347469d
#
# Lane-name mapping: GitHub forbids dynamic job IDs, so per-module lanes
# surface as display names (lint (collector)) instead of the old literal IDs
# (lint-collector). Branch protection keys only on ci-complete, and no other
# consumer (ruleset, docs, Dependabot) keys on literal lane names, so nothing
# else breaks.
#
# Deliberate deviations from the inline lanes:
# - shell no longer selects on .github/workflows edits. That trigger existed
#   to run test-lane-selection.sh, which tested the inline classifier that is
#   gone (script retired with this move). shellcheck still runs on **/*.sh
#   and fail-closed misc inputs; workflow edits are covered by actionlint plus
#   the full lane set the reusable selects on workflows=true.
# - Coverage floors are enforced inline by the reusable race lanes (floors
#   passed below). scripts/ci/check-coverage.sh stays for `make race` local
#   parity, and its test still runs via `make shape` / `make ci`. The two
#   implementations are kept in sync by scripts/ci/test-floors-sync.sh
#   (also via `make shape`), which fails when the workflow input drifts
#   from the Makefile defaults.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write # artifact uploads (coverprofiles, gosec SARIF) inside the called workflow

jobs:
  gates:
    uses: eshu-hq/.github/.github/workflows/go-multi-module-ci.yml@79dd01d7719645485e2e8e07e8075ccba8c518b5
    with:
      modules: '["collector", "factschema"]'
      coverage-floors: '{"collector": 85.0, "factschema": 48.3}'
      fixture-subpaths: 'testdata,schema,fixturepack'
      generate-check-modules: '["factschema"]'
      generate-check-command: 'make generate-check'
      generate-check-go-module: 'factschema'
      satellite-repository: 'eshu-hq/eshu-collector-kubernetes-live'
      satellite-ref: '2ec5ade94f2ccee4401e6c7767b1b5bc4347469d'
      primary-module: 'collector'
      # consumer-compat-command left at its default, which shells out to the
      # caller's scripts/ci/consumer-compat.sh against the satellite above.
      # tidy-check-command keeps the snapshot semantics: a PR that legitimately
      # edits go.mod must not fail its own diff (the reusable inline default
      # of `go mod tidy -diff` plus `git diff` would).
      tidy-check-command: 'bash scripts/ci/tidy-check.sh {0}'
      # Whole-tree census (Go and non-Go prose alike); runs once per lint
      # module and is idempotent. Extra format args are ignored.
      file-cap-command: 'make file-cap'
      file-cap-deps-command: 'sudo apt-get update && sudo apt-get install --yes ripgrep'

  ci-complete:
    if: always()
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate (gates carry every lane; skipped lanes succeed)
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          if [ '${{ needs.gates.result }}' != 'success' ]; then
            echo 'ci-complete: the reusable gates failed or were cancelled' >&2
            exit 1
          fi
          echo 'ci-complete: every selected lane succeeded or legitimately skipped'
